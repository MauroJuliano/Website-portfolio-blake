<link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">

<section class="centered">
  <h2 class="section-title">Career</h2>
</section>

<section class="split">
  <div class="split__left">
    <ul class="list timeline" id="career-list"></ul>
  </div>

  <div class="split__right">
    <div class="sticky">
      <div class="media-shift">
        <!-- Substituir <figure class="media-frame"> por Flickity -->
        <div class="career-carousel js-flickity" 
             data-flickity-options='{ "wrapAround": true, "cellAlign": "center", "pageDots": true, "prevNextButtons": false }'>
          <!-- Images will be added dynamically -->
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
