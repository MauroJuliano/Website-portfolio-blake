<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux - Blake Figueiredo</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/toggle.css">
  <link rel="stylesheet" href="/css/projects.css">
</head>

<body>

  <nav class="floating-nav">
    <div class="nav-left">
      <div class="logotype">Blake Figueiredo</div>
    </div>

    <div class="nav-right">
      <div class="hero-buttons">
        <div class="lang-selector">
          <label>/</label>
          <input type="radio" name="lang" id="pt">
          <label for="pt">PT</label>
          <input type="radio" name="lang" id="en" checked>
          <label for="en">EN</label>
        </div>

        <input type="checkbox" id="themeToggle" class="toggle-checkbox">
        <label for="themeToggle" class="toggle-btn"></label>
      </div>
    </div>
  </nav>

  <main class="container">  
    <!-- Galeria -->
    <section class="product-gallery">
  <img class="main-image" id="mainImage">

  <div class="thumbnails" id="thumbnails"></div>
    </section>

  <section class="product-info">
  <div class="product-title" id="title"></div>
  <div class="rating" id="status"></div>

  <button class="add-cart" id="githubBtn">View on Github ↗︎</button>
  
  <div class="colors">
    <strong class="tech-title">Technologies</strong>
    <div id="technologies"></div>
  </div>
  
  

  <div class="options">
    <p id="shortDescription"></p>
  </div>  
  
  
  
  </section>
  <section class="text-container">
    <p id="longDescription"></p>
  </section>

  <!-- Scripts -->

  <script type="module" src="/js/project-page.js"></script>



</body>
</html>
